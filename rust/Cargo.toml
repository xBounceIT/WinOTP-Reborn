[workspace]
resolver = "2"
members = ["winotp-browser-bridge-host", "winotp-core", "winotp-updater"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
hex = "0.4"
pbkdf2 = "0.12"
percent-encoding = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "3"
